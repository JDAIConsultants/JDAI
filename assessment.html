// ─── GRADING (internal — not shown to client) ─────────────────────────────────
function grade(t) {
  if (t.tier === 4) return "F";
  if (t.tier === 3) return t.dataRisk === "Exposed" ? "F" : "D";
  if (t.tier === 2) {
    if (t.dataRisk === "Exposed") return "D";
    if (t.dataRisk === "Protected" && t.ethics === "Engaged") return "B";
    if (t.dataRisk === "Protected") return "C";

  }
  if (t.dataRisk === "Protected" && t.ethics === "Engaged") return "A";
  if (t.dataRisk === "Protected" && t.hasDPA) return "B";
  return "C";
}

// ─── SCORECARD LOGIC ──────────────────────────────────────────────────────────
function buildScorecard(tools, gov) {
  const dist = { A:0, B:0, C:0, D:0, F:0 };
  tools.forEach(t => dist[t.grade]++);

  const gaps = [];
  if (tools.some(t => t.dataRisk === "Exposed"))
    gaps.push({ area:"Data Confidentiality", severity:"CRITICAL", summary:"One or more tools in your stack present immediate client data exposure risk. This requires attention before your next client intake." });
  else if (tools.some(t => !t.hasDPA && t.dataRisk !== "Protected"))
    gaps.push({ area:"Data Confidentiality", severity:"HIGH", summary:"Some tools lack confirmed data protection agreements. Client data should not enter these tools until this is resolved." });
  if (tools.some(t => t.tier === 4))
    gaps.push({ area:"Tool Classification", severity:"CRITICAL", summary:"Your stack includes a tool subject to FTC enforcement action. Immediate review is required." });
  else if (tools.some(t => t.tier === 3))
    gaps.push({ area:"Tool Classification", severity:"HIGH", summary:"Your stack includes tools that lack the professional-grade safeguards required for attorney use." });
  if (tools.some(t => t.tier >= 3 && (t.category.includes("Research") || t.category.includes("Legal"))))
    gaps.push({ area:"Legal Research Integrity", severity:"CRITICAL", summary:"One or more tools being used for legal research lack the citation verification required under attorney competence standards." });
  if (tools.some(t => t.ethics === "Silent" && t.tier <= 2))
    gaps.push({ area:"Supervision & Oversight", severity:"MEDIUM", summary:"Some tools show no engagement with bar ethics requirements. A documented supervision protocol is needed." });
  if (gov.hasPolicy === "no")
    gaps.push({ area:"Governance Policy", severity:"HIGH", summary:"No written AI governance policy is in place. This is required under ABA Opinion 512." });
  else if (gov.hasPolicy === "partial")
    gaps.push({ area:"Governance Policy", severity:"MEDIUM", summary:"An AI governance policy is in progress. Formalizing it reduces your exposure." });
  if (gov.hasDPA === "no")
    gaps.push({ area:"Data Protection Agreements", severity:"HIGH", summary:"No Data Processing Agreements have been executed. This creates confidentiality exposure for any client data entered into AI tools." });
  else if (gov.hasDPA === "partial")
    gaps.push({ area:"Data Protection Agreements", severity:"MEDIUM", summary:"DPA coverage is incomplete. Tools without confirmed agreements cannot be used for client matter work." });
  if (gov.hasTrained === "no")
    gaps.push({ area:"Staff Training", severity:"MEDIUM", summary:"Staff AI training is not documented. The supervising attorney is responsible for staff AI use under professional conduct rules." });
  else if (gov.hasTrained === "partial")
    gaps.push({ area:"Staff Training", severity:"MEDIUM", summary:"Staff training is informal. Formalizing and documenting it reduces supervision exposure." });
  if (gov.hasEngagementLetter === "no")
    gaps.push({ area:"Client Disclosure", severity:"MEDIUM", summary:"Engagement letters do not include AI disclosure language. Client notification is contemplated when AI materially affects a matter." });
  else if (gov.hasEngagementLetter === "partial")
    gaps.push({ area:"Client Disclosure", severity:"MEDIUM", summary:"AI disclosure language is under review. Finalizing it completes your client communication obligations." });

  const hasCritical = gaps.some(g => g.severity === "CRITICAL");
  const hasHigh     = gaps.some(g => g.severity === "HIGH");
  const urgency     = hasCritical ? "ACT NOW" : hasHigh ? "ACT SOON" : gaps.length > 0 ? "REVIEW RECOMMENDED" : "MAINTAIN";
  const urgencyColor = hasCritical ? C.red   : hasHigh ? C.amber   : gaps.length > 0 ? C.blue   : C.green;
  const urgencyBg    = hasCritical ? C.redBg : hasHigh ? C.amberBg : gaps.length > 0 ? C.blue2Bg: C.greenBg;
  const urgencyBd    = hasCritical ? C.redBd : hasHigh ? C.amberBd : gaps.length > 0 ? C.blue2Bd: C.greenBd;
  const urgencyDesc  = hasCritical
    ? "Critical risks identified. Your current AI stack creates immediate ethics exposure. Professional review is required before your next client matter."
    : hasHigh
    ? "Significant gaps identified. A structured review with an advisor will help you resolve these efficiently and build a defensible governance posture."
    : gaps.length > 0
    ? "Moderate gaps identified. Your foundation is workable but has areas that would benefit from professional review and documentation."
    : "No immediate issues identified. Maintaining your posture requires ongoing review as tools, terms, and bar guidance continue to evolve.";

  return { dist, gaps, urgency, urgencyColor, urgencyBg, urgencyBd, urgencyDesc, totalTools: tools.length };
}

      {steps.map((s,i) => (
        <div key={i} style={{flex:1,textAlign:"center"}}>
          <div style={{height:"3px",background:i<step?C.gold:C.border,borderRadius:"2px",marginBottom:"4px",transition:"background 0.3s"}}/>
          <div style={{fontSize:"9px",color:i<step?C.gold:C.textDim,fontFamily:"'Courier New', monospace",letterSpacing:"0.06em",textTransform:"uppercase"}}>{s}</div>
        </div>
      ))}
    </div>
  );
}

          <div style={{marginBottom:"14px"}}>
            <label style={S.lbl}>Firm or Attorney Name <span style={{color:C.red}}>*</span></label>
            <input style={{...S.inp,borderColor:errors.name?C.red:C.border}} placeholder="e.g. Smith & Associates, P.A." value={firm.name} onChange={e=>{setFirm(p=>({...p,name:e.target.value}));setErrors(p=>({...p,name:""}));}}/>
            {errors.name && <div style={S.err}>{errors.name}</div>}
          </div>

          <div style={{marginBottom:"14px"}}>
            <label style={S.lbl}>Email Address <span style={{color:C.red}}>*</span></label>
            <input style={{...S.inp,borderColor:errors.email?C.red:C.border}} placeholder="e.g. jane@smithlaw.com" value={firm.email} onChange={e=>{setFirm(p=>({...p,email:e.target.value}));setErrors(p=>({...p,email:""}));}}/>
            {errors.email && <div style={S.err}>{errors.email}</div>}
          </div>

          <div style={{marginBottom:"14px"}}>
            <label style={S.lbl}>Primary Practice Area <span style={{color:C.textDim,fontSize:"9px"}}>(optional)</span></label>
            <select style={S.sel} value={firm.practiceArea} onChange={e=>setFirm(p=>({...p,practiceArea:e.target.value}))}>
              <option value="">Select...</option>
              {PRACTICE_AREAS.map(a=><option key={a}>{a}</option>)}
            </select>
          </div>

          <div style={{marginBottom:"24px"}}>
            <label style={S.lbl}>Firm Size <span style={{color:C.textDim,fontSize:"9px"}}>(optional)</span></label>
            <select style={S.sel} value={firm.firmSize} onChange={e=>setFirm(p=>({...p,firmSize:e.target.value}))}>
              <option value="">Select...</option>
              {FIRM_SIZES.map(s=><option key={s}>{s}</option>)}
            </select>
          </div>

          <div style={{display:"flex",justifyContent:"flex-end"}}>
            <button style={S.btn} onClick={()=>{ if(validateStep1()) setStep(2); }}>Next →</button>
          </div>
        </div>
      </div>
    </div>
  );

  // ── STEP 2 — GOVERNANCE ───────────────────────────────────────────────────
  if (step === 2) {
    const GQ = [
      { key:"hasPolicy",           label:"Does your firm have a written AI governance policy?",              yes:"Yes — written and in use", no:"No",            partial:"In progress" },
      { key:"hasDPA",              label:"Have you signed a Data Processing Agreement with any AI tools?",    yes:"Yes — at least one",       no:"No / Not sure", partial:"Some, not all" },
      { key:"hasTrained",          label:"Has your staff received training on AI use rules?",                 yes:"Yes — documented",          no:"No",            partial:"Informal only" },
      { key:"hasEngagementLetter", label:"Do your engagement letters include AI disclosure language?",         yes:"Yes — updated",             no:"No",            partial:"Under review" },
    ];
    return (
      <div style={S.app}>
        <style>{`*{box-sizing:border-box} body{margin:0} button:hover{opacity:.85}`}</style>
        <div style={S.hdr}><div style={S.logo}>{BRAND.name}</div><div style={S.sub}>Step 2 of 4 — Governance Baseline</div></div>
        <div style={S.main}>
          <ProgressBar step={2}/>
          <div style={{...S.card,maxWidth:"520px",margin:"0 auto"}}>
            <div style={S.shdr}>4 Quick Questions</div>
            <p style={{fontSize:"13px",color:C.textMut,marginTop:0,marginBottom:"18px",lineHeight:"1.7"}}>These questions help identify where your firm's AI governance stands today.</p>
            {GQ.map(({key,label,yes,no,partial})=>(
              <div key={key} style={{marginBottom:"18px",paddingBottom:"18px",borderBottom:`1px solid ${C.border}33`}}>
                <div style={{fontSize:"13px",color:C.textPri,marginBottom:"10px",lineHeight:"1.5"}}>{label}</div>
                <div style={{display:"flex",flexDirection:"column",gap:"7px"}}>
                  {[[yes,"yes",C.green,C.greenBg,C.greenBd],[no,"no",C.red,C.redBg,C.redBd],[partial,"partial",C.amber,C.amberBg,C.amberBd]].map(([lbl,val,col,bg,bd])=>{
                    const sel=gov[key]===val;
                    return (
                      <div key={val} onClick={()=>setGov(p=>({...p,[key]:val}))} style={{display:"flex",alignItems:"center",gap:"10px",padding:"10px 14px",background:sel?bg:C.navyCard,border:`1px solid ${sel?bd:C.border}`,borderRadius:"4px",cursor:"pointer",transition:"all 0.15s"}}>
                        <div style={{width:"15px",height:"15px",borderRadius:"50%",border:`2px solid ${sel?col:C.border}`,background:sel?col:"transparent",flexShrink:0}}/>
                        <span style={{fontSize:"13px",color:sel?C.textPri:C.textMut}}>{lbl}</span>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:"6px"}}>
              <button style={S.btnSm} onClick={()=>setStep(1)}>← Back</button>
              <button style={S.btn} onClick={()=>setStep(3)}>Next: Your Tools →</button>
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ── STEP 3 — TOOL SELECTION ───────────────────────────────────────────────
  if (step === 3) {
    const TIER_LABEL = { 1:"Purpose-Built Legal AI", 2:"General AI Tools", 3:"Other / Unverified", 4:"Flagged Tools" };
    const byTier = [1,2,3,4].map(t=>({ t, tools:filtered.filter(x=>x.tier===t) }));
    return (
      <div style={S.app}>
        <style>{`*{box-sizing:border-box} body{margin:0} ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:${C.navy}} ::-webkit-scrollbar-thumb{background:${C.border};border-radius:3px} button:hover{opacity:.85}`}</style>
        <div style={S.hdr}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:"8px"}}>
            <div><div style={S.logo}>{BRAND.name}</div><div style={S.sub}>Step 3 of 4 — Tools Your Firm Uses</div></div>
            <div style={{display:"flex",gap:"8px",alignItems:"center"}}>
              <span style={{fontSize:"11px",color:C.textMut,fontFamily:"'Courier New', monospace"}}>{selected.length} selected</span>
              <button style={S.btnSm} onClick={()=>setStep(2)}>← Back</button>
              <button style={{...S.btn,opacity:selected.length===0?0.5:1}} disabled={selected.length===0} onClick={()=>setStep(4)}>See Results →</button>
            </div>
          </div>
        </div>
        <div style={S.main}>
          <ProgressBar step={3}/>
          <input style={{...S.inp,marginBottom:"10px"}} placeholder="Search tools by name..." value={q} onChange={e=>setQ(e.target.value)}/>

          <div style={{marginBottom:"14px"}}>
            <div style={{fontSize:"11px",color:C.textDim,marginBottom:"6px",lineHeight:"1.5"}}>
              Don't see a tool you use? Add it below — anything you add is included in your results.
            </div>
            <div style={{display:"flex",gap:"8px"}}>
              <input style={{...S.inp,flex:1}} placeholder="Enter tool name..." value={cName} onChange={e=>setCName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addCustom()}/>
              <button style={S.btnSm} onClick={addCustom}>+ Add</button>
            </div>
          </div>

          {cTools.length>0&&(
            <div style={{...S.card,borderColor:C.amberBd,marginBottom:"14px"}}>
              <div style={{...S.lbl,color:C.amber,marginBottom:"8px"}}>Tools You Added</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:"6px"}}>
                {cTools.map(t=>(
                  <div key={t.id} style={{background:C.amberBg,border:`1px solid ${C.amberBd}`,borderRadius:"4px",padding:"5px 10px",fontSize:"12px",color:C.textPri,display:"flex",alignItems:"center",gap:"6px"}}>
                    {t.name}<button style={S.btnDel} onClick={()=>setCTools(p=>p.filter(x=>x.id!==t.id))}>×</button>
                  </div>
                ))}
              </div>
            </div>
          )}

          {byTier.map(({t,tools:tt})=>{
            if (!tt.length) return null;
            const sc = tt.filter(x=>selIds.has(x.id)).length;
            return (
              <div key={t} style={{marginBottom:"14px"}}>
                <div style={{background:TIER_COLOR[t],borderRadius:"4px 4px 0 0",padding:"8px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:"11px",color:C.goldLt,fontFamily:"'Courier New', monospace",letterSpacing:"0.08em"}}>{TIER_LABEL[t]}</span>
                  {sc>0&&<span style={{fontSize:"10px",color:C.gold,fontFamily:"'Courier New', monospace"}}>{sc} selected</span>}
                </div>
                <div style={{border:`1px solid ${C.border}`,borderTop:"none",borderRadius:"0 0 4px 4px",overflow:"hidden"}}>
                  {tt.map((tool,i)=>{
                    const sel=selIds.has(tool.id);
                    return (
                      <div key={tool.id} onClick={()=>toggle(tool.id)} style={{display:"flex",alignItems:"flex-start",gap:"10px",padding:"11px 14px",background:sel?"#1e2a4033":i%2===0?C.navyCard:C.navyMid,borderLeft:sel?`3px solid ${C.gold}`:"3px solid transparent",cursor:"pointer",borderBottom:i<tt.length-1?`1px solid ${C.border}22`:"none",transition:"all 0.1s"}}>
                        <div style={{width:"17px",height:"17px",border:`1px solid ${sel?C.gold:C.border}`,borderRadius:"3px",background:sel?C.gold:"transparent",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:"2px"}}>
                          {sel&&<span style={{color:C.navy,fontSize:"10px",fontWeight:"900"}}>✓</span>}
                        </div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:"13px",color:sel?C.textPri:C.textMut,fontWeight:sel?"600":"400"}}>{tool.name}</div>
                          <div style={{fontSize:"10px",color:C.textDim,fontFamily:"'Courier New', monospace",marginTop:"2px"}}>{tool.category}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          <div style={{display:"flex",justifyContent:"flex-end",marginTop:"8px",paddingBottom:"32px"}}>
            <button style={{...S.btn,opacity:selected.length===0?0.5:1}} disabled={selected.length===0} onClick={()=>setStep(4)}>
              See My Results ({selected.length} tool{selected.length!==1?"s":""}) →
            </button>
          </div>
        </div>
      </div>
    );
  }

  // ── STEP 4 — RESULTS ──────────────────────────────────────────────────────
  const sc = scorecard;
  return (
    <div style={S.app}>
      <style>{`*{box-sizing:border-box} body{margin:0} ::-webkit-scrollbar{width:4px} ::-webkit-scrollbar-track{background:${C.navy}} ::-webkit-scrollbar-thumb{background:${C.border};border-radius:3px} button:hover{opacity:.85} a{color:${C.gold}} @media print{.np{display:none!important}}`}</style>
      <div style={{...S.hdr,background:C.navyMid}} className="np">
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div><div style={S.logo}>{BRAND.name}</div><div style={S.sub}>Your AI Readiness Results</div></div>
          <button style={S.btnSm} onClick={()=>setStep(3)}>← Edit Tools</button>
        </div>
      </div>

      <div style={S.main}>
        <ProgressBar step={4}/>

        {/* HEADER */}
        <div style={{marginBottom:"16px"}}>
          <div style={{fontSize:"19px",fontWeight:"600",color:C.textPri}}>{firm.name} — AI Readiness Assessment</div>
          <div style={{fontSize:"11px",color:C.textDim,fontFamily:"'Courier New', monospace",marginTop:"3px"}}>
            {[firm.practiceArea,firm.firmSize].filter(Boolean).join(" · ")}{(firm.practiceArea||firm.firmSize)?" · ":""}{new Date().toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}
          </div>
        </div>

        {/* URGENCY BANNER */}
        <div style={{background:sc.urgencyBg,border:`1px solid ${sc.urgencyBd}`,borderRadius:"6px",padding:"18px 20px",marginBottom:"14px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px",marginBottom:"10px",flexWrap:"wrap"}}>
            <span style={{fontSize:"22px",fontWeight:"800",color:sc.urgencyColor,fontFamily:"'Courier New', monospace",letterSpacing:"0.1em"}}>{sc.urgency}</span>
            <span style={{fontSize:"12px",color:C.textMut}}>based on {sc.totalTools} tool{sc.totalTools!==1?"s":""} and your governance answers</span>
          </div>
          <div style={{fontSize:"13px",color:C.textPri,lineHeight:"1.7"}}>{sc.urgencyDesc}</div>
        </div>

        {/* GRADE DISTRIBUTION */}
        <div style={S.card}>
          <div style={S.shdr}>Tool Risk Distribution — {sc.totalTools} Tools Assessed</div>
          <p style={{fontSize:"12px",color:C.textMut,marginTop:0,marginBottom:"14px",lineHeight:"1.6"}}>
            Tools are evaluated against a four-factor framework: data confidentiality, ethics engagement, practice area fit, and cost accessibility. The distribution below shows how your stack grades out overall. Individual tool details are reviewed during your consultation.
          </p>
          <div style={{display:"flex",gap:"8px",flexWrap:"wrap",marginBottom:"14px"}}>
            {["A","B","C","D","F"].map(g => sc.dist[g] > 0 && (
              <div key={g} style={{background:GRADE_BG[g],border:`1px solid ${GRADE_BD[g]}`,borderRadius:"6px",padding:"12px 18px",textAlign:"center",minWidth:"64px"}}>
                <div style={{fontSize:"26px",fontWeight:"800",color:GRADE_COLOR[g],fontFamily:"'Courier New', monospace"}}>{sc.dist[g]}</div>
                <span style={badge(GRADE_COLOR[g],GRADE_BG[g],GRADE_BD[g])}>{g}</span>
              </div>
            ))}
          </div>
          <div style={{fontSize:"11px",color:C.textDim,fontFamily:"'Courier New', monospace",background:C.navy,borderRadius:"4px",padding:"9px 12px",lineHeight:"1.7"}}>
            A = Strong on all factors · B = Strong with minor gap · C = Acceptable with governance in place · D = Gaps requiring remediation · F = Do not use for client matters
          </div>
        </div>

        {/* GAP AREAS */}
        <div style={S.card}>
          <div style={S.shdr}>Areas Requiring Attention — {sc.gaps.length} Identified</div>
          {sc.gaps.length === 0 ? (
            <div style={{background:C.greenBg,border:`1px solid ${C.greenBd}`,borderRadius:"5px",padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px"}}>
                <span style={badge(C.green,C.greenBg,C.greenBd)}>CLEAR</span>
                <span style={{fontSize:"13px",fontWeight:"700",color:C.textPri}}>No Immediate Gaps Identified</span>
              </div>
              <div style={{fontSize:"12px",color:C.textMut,lineHeight:"1.6"}}>Your current tool stack and governance posture have no immediate red flags. A consultation can confirm this picture and set up ongoing monitoring as the market evolves.</div>
            </div>
          ) : sc.gaps.map((g,i)=>{
            const sv = S.sev[g.severity] || S.sev.MEDIUM;
            return (
              <div key={i} style={{background:sv.bg,border:`1px solid ${sv.bd}`,borderRadius:"5px",padding:"13px 16px",marginBottom:"9px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"8px",marginBottom:"6px",flexWrap:"wrap"}}>
                  <span style={badge(sv.c,sv.bg,sv.bd)}>{g.severity}</span>
                  <span style={{fontSize:"13px",fontWeight:"700",color:C.textPri}}>{g.area}</span>
                </div>
                <div style={{fontSize:"12px",color:C.textMut,lineHeight:"1.6"}}>{g.summary}</div>
                <div style={{marginTop:"8px",fontSize:"11px",color:sv.c,fontFamily:"'Courier New', monospace"}}>→ Discuss remediation steps with your JDAI Consultants advisor</div>
              </div>
            );
          })}
        </div>

        {/* WHAT HAPPENS NEXT */}
        <div style={S.card}>
          <div style={S.shdr}>What Happens Next</div>
          <div style={{fontSize:"13px",color:C.textMut,lineHeight:"1.8"}}>
            {sc.urgency==="ACT NOW"            && <p style={{margin:"0 0 10px",color:C.textPri}}>Based on your results, some of your current tools require immediate attention. The gaps identified above create real ethics exposure — a consultation will give you a clear, prioritized remediation plan.</p>}
            {sc.urgency==="ACT SOON"           && <p style={{margin:"0 0 10px",color:C.textPri}}>Your results show significant gaps that are manageable with the right approach. A structured consultation will give you a remediation plan and the documentation to support it.</p>}
            {sc.urgency==="REVIEW RECOMMENDED" && <p style={{margin:"0 0 10px",color:C.textPri}}>Your foundation is workable. A consultation will help close remaining gaps, formalize your governance posture, and ensure you stay compliant as the market evolves.</p>}
            {sc.urgency==="MAINTAIN"           && <p style={{margin:"0 0 10px",color:C.textPri}}>You're in good shape. A consultation can confirm this picture, identify any blind spots, and establish a review schedule that keeps you current.</p>}
            <p style={{margin:"0 0 10px"}}>Legal AI is moving faster than almost any other technology sector. A tool that is appropriate today may shift with an acquisition, a data policy change, or a new bar ethics opinion. Staying current requires ongoing attention.</p>
          </div>
        </div>

        {/* CTA */}
        <div style={{background:`linear-gradient(135deg, ${C.navyMid}, ${C.navy})`,border:`1px solid ${C.gold}44`,borderRadius:"8px",padding:"24px 22px",marginBottom:"14px",textAlign:"center"}}>
          <div style={{fontSize:"16px",fontWeight:"600",color:C.gold,marginBottom:"6px",fontFamily:"'Courier New', monospace",letterSpacing:"0.08em"}}>{BRAND.cta}</div>
          <div style={{fontSize:"12px",color:C.textMut,marginBottom:"20px"}}>{BRAND.ctaSub}</div>

          {!submitted ? (
            <>
              <p style={{fontSize:"12px",color:C.textMut,marginBottom:"16px",lineHeight:"1.6",marginTop:0}}>
                Submit your results and a JDAI Consultants advisor will review them and be in touch within one business day. Or reach out directly below.
              </p>
              <button
                style={{...S.btn,width:"100%",padding:"13px",marginBottom:"10px",opacity:submitting?0.7:1}}
                onClick={handleSubmit}
                disabled={submitting}
              >
                {submitting ? "Submitting…" : "Submit Results — Request a Consultation"}
              </button>
              {submitErr && <div style={{...S.err,textAlign:"center",marginBottom:"8px"}}>{submitErr}</div>}
              <div style={{fontSize:"11px",color:C.textDim,marginBottom:"6px"}}>or contact us directly</div>
              <a href={`mailto:Dzissman@jdaiconsultants.com?subject=AI Readiness Assessment — ${encodeURIComponent(firm.name)}`} style={{fontSize:"12px",fontFamily:"'Courier New', monospace",textDecoration:"none"}}>
                Dzissman@jdaiconsultants.com
              </a>
            </>
          ) : (
            <div style={{background:C.greenBg,border:`1px solid ${C.greenBd}`,borderRadius:"6px",padding:"18px"}}>
              <div style={{fontSize:"14px",color:"#6ee7b7",fontWeight:"600",marginBottom:"8px"}}>✓ Results Submitted</div>
              <div style={{fontSize:"12px",color:C.textMut,lineHeight:"1.6",marginBottom:"12px"}}>
                A JDAI Consultants advisor will review your assessment and be in touch within one business day. You can also reach us directly:
              </div>
              <a href={`mailto:Dzissman@jdaiconsultants.com?subject=AI Readiness Assessment — ${encodeURIComponent(firm.name)}`} style={{fontSize:"12px",fontFamily:"'Courier New', monospace",textDecoration:"none"}}>
                Dzissman@jdaiconsultants.com
              </a>
              <div style={{marginTop:"16px",paddingTop:"14px",borderTop:"1px solid "+C.greenBd}}>
                <a href="index.html" style={{fontSize:"12px",fontFamily:"'Courier New', monospace",color:C.gold,textDecoration:"none"}}>&#8592; Back to JDAI Consultants</a>
              </div>
            </div>
          )}
        </div>

        {/* FOOTER */}
        <div style={{borderTop:`1px solid ${C.border}`,paddingTop:"13px",marginTop:"6px",fontSize:"10px",color:C.textDim,fontFamily:"'Courier New', monospace",lineHeight:"1.9",paddingBottom:"32px"}}>
          {BRAND.footer}
          <div style={{marginTop:"12px"}}><a href="index.html" style={{color:C.gold,textDecoration:"none"}}>&#8592; Return to jdaiconsultants.com</a></div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
